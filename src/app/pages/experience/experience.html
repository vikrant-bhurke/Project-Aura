<section class="experience section" id="experience">
  <div class="container">
    <div appReveal>
      <app-section-header
        tag="Experience"
        title="My Journey"
        accent="Journey"
        subtitle="Professional experience building enterprise Angular applications." />
    </div>

    <div class="timeline">
      @for (job of experience; track job.company; let i = $index) {
        <div class="timeline-item" appReveal [delay]="(i * 120) + 'ms'">
          <div class="timeline-marker">
            <div class="company-logo" [class.has-image]="!!job.logoUrl">
              @if (job.logoUrl) {
                <img [src]="job.logoUrl" [alt]="job.company + ' logo'" width="40" height="40" loading="lazy" decoding="async" />
              } @else {
                {{ job.logo }}
              }
            </div>
          </div>
          <div class="timeline-card">
            <div class="card-top">
              <span class="period">{{ job.period }}</span>
              <span class="location">
                <mat-icon>location_on</mat-icon>
                {{ job.location }}
              </span>
            </div>
            <h3>{{ job.role }}</h3>
            <span class="company">{{ job.company }}</span>
            <p class="summary">{{ job.summary }}</p>
            <ul>
              @for (point of job.highlights; track point) {
                <li>{{ point }}</li>
              }
            </ul>
          </div>
        </div>
      }
    </div>
  </div>
</section>
