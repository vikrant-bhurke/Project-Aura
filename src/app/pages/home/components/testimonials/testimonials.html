<section class="testimonials section" id="testimonials">
  <div class="container">
    <div appReveal>
      <app-section-header
        tag="Testimonials"
        title="What People Say"
        accent="Say"
        subtitle="Feedback from colleagues and clients I've worked with." />
    </div>

    <div class="testimonials-grid">
      @for (item of testimonials; track item.name; let i = $index) {
        <article class="testimonial-card" appReveal [delay]="(i * 100) + 'ms'">
          <div class="author">
            <div class="avatar-wrap">
              <div class="avatar" [class.has-photo]="!!item.photoUrl">
                @if (item.photoUrl) {
                  <img [src]="item.photoUrl" [alt]="item.name" width="48" height="48" loading="lazy" decoding="async" />
                } @else {
                  {{ item.avatar }}
                }
              </div>
              @if (item.linkedin) {
                <a
                  class="linkedin-badge"
                  [href]="item.linkedin"
                  target="_blank"
                  rel="noopener noreferrer"
                  [attr.aria-label]="item.name + ' on LinkedIn'">
                  <svg viewBox="0 0 24 24" width="11" height="11" aria-hidden="true" fill="currentColor">
                    <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.062 2.062 0 012.063-2.063 2.062 2.062 0 012.063 2.063 2.062 2.062 0 01-2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                  </svg>
                </a>
              }
            </div>
            <div class="author-meta">
              <div class="name">{{ item.name }}</div>
              <div class="role">{{ item.role }}</div>
            </div>
          </div>
          <p class="quote">"{{ item.quote }}"</p>
          <div class="stars" [attr.aria-label]="item.rating + ' out of 5 stars'">
            @for (star of stars; track star) {
              <mat-icon [class.dim]="starIcon(item.rating, star) === 'star_border'">
                {{ starIcon(item.rating, star) }}
              </mat-icon>
            }
          </div>
        </article>
      }
    </div>
  </div>
</section>
