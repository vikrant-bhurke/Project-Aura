<section class="certifications section" id="certifications">
  <div class="container">
    <div appReveal>
      <app-section-header
        tag="Credentials"
        title="Certifications"
        accent="Certifications"
        subtitle="Validated expertise in modern web technologies and cloud platforms." />
    </div>

    <div class="certs-grid">
      @for (cert of certifications; track cert.title; let i = $index) {
        <div class="cert-card" appReveal [delay]="(i * 80) + 'ms'">
          <div class="cert-icon" [style.--cert-color]="cert.color">
            <img [src]="cert.icon" [alt]="cert.title" width="40" height="40" loading="lazy" decoding="async" />
          </div>
          <h3>{{ cert.title }}</h3>
        </div>
      }
    </div>
  </div>
</section>
