<section class="hero" id="home">
  <div class="hero-ambient" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
  </div>

  <div class="container hero-container">
    <div class="hero-left">
      <div class="hero-badge anim-item" style="--i: 0">👋 Hi, I'm</div>

      <h1 class="anim-item" style="--i: 1">
        Vikrant
        <span>Bhurke</span>
      </h1>

      <h2 class="hero-roles anim-item" style="--i: 2">
        Software Engineer <span>|</span> Angular Expert <span>|</span> AI Enthusiast <span>|</span> Future Export Entrepreneur
      </h2>

      <p class="hero-bio anim-item" style="--i: 3">
        Building enterprise-grade web applications, beautiful user experiences
        and scalable digital products with Angular and modern technologies.
      </p>

      <div class="hero-buttons anim-item" style="--i: 4">
        <a routerLink="/" fragment="projects" class="primary-btn">View Projects</a>
        <a [href]="resumeUrl" class="secondary-btn" download>Download Resume</a>
      </div>

      <div class="socials anim-item" style="--i: 5">
        <a [href]="social.github" target="_blank" rel="noopener" aria-label="GitHub">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        </a>
        <a [href]="social.linkedin" target="_blank" rel="noopener" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.062 2.062 0 012.063-2.063 2.062 2.062 0 012.063 2.063 2.062 2.062 0 01-2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
        </a>
        <a [href]="social.twitter" target="_blank" rel="noopener" aria-label="Twitter">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        </a>
        <a [href]="'mailto:' + socialEmail" aria-label="Email">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        </a>
      </div>
    </div>

    <div class="hero-right">
      <div class="hero-visual">
        <div class="glow-ring"></div>

        <div class="tech angular" style="--delay: 0s">
          <img src="assets/icons/Angular.svg" alt="Angular" width="34" height="34" decoding="async" />
        </div>
        <div class="tech typescript" style="--delay: 0.4s">
          <img src="assets/icons/typescript.svg" alt="TypeScript" width="34" height="34" decoding="async" />
        </div>
        <div class="tech javascript" style="--delay: 0.8s">
          <img src="assets/icons/javascript.svg" alt="JavaScript" width="34" height="34" decoding="async" />
        </div>
        <div class="tech node" style="--delay: 1.2s">
          <img src="assets/icons/nodejs.svg" alt="Node.js" width="34" height="34" decoding="async" />
        </div>
        <div class="tech aws" style="--delay: 1.6s">
          <img src="assets/icons/aws.svg" alt="AWS" width="34" height="34" decoding="async" />
        </div>

        <div class="profile-frame">
          <picture>
            <source srcset="assets/images/vikrant.webp" type="image/webp" />
            <img
              class="profile-image"
              src="assets/images/vikrant.jpg"
              width="640"
              height="640"
              alt="Portrait of Vikrant Bhurke, Software Engineer"
              decoding="async"
              fetchpriority="high" />
          </picture>
        </div>
      </div>
    </div>
  </div>
</section>
